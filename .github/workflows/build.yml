name: macOS checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run detector and mode regression tests
        run: ./Tests/run-tests.sh
      - name: Build and analyze app and helper
        run: >-
          xcodebuild -project AWDLControl.xcodeproj -scheme AWDLControl
          -configuration Release -derivedDataPath "$RUNNER_TEMP/AWDLControl-build"
          CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO
          build analyze
